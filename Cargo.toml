[workspace]
members = ["crates/shenbot", "crates/ica-ext-sdk"]
default-members = ["crates/shenbot"]
resolver = "2"

[workspace.dependencies]
serde = { version = "1.0", features = ["derive"] }
serde_json = "1.0"
tokio = "1.53"

[patch.crates-io]
rust_socketio = { git = "https://github.com/shenjackyuanjie/rust-socketio.git", rev = "fa73b3797b7439444532c64eeee106453df9e3db" }
# pyo3 = { git = "https://github.com/PyO3/pyo3.git", branch = "main" }
