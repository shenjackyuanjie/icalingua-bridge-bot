

# 填写 [ica] 但不填写此项则不启用 ica
enable_ica = true # 是否启用 ica
# 填写 [matrix] 但不填写此项则不启用 matrix
enable_matrix = true # 是否启用 matrix

enable_py = true # 是否启用 Python 插件
enable_ext = false # 是否启用 ICA 外部进程插件；可与 Python 同时启用

# [ext]
# shadow_dir = "./.ext_runtime"
# handshake_timeout_ms = 5000
# default_drain_timeout_ms = 30000
#
# [[ext.plugins]]
# id = "ds_monitor"
# enabled = true
# binary = 'D:\apps\ds-monitor\target\release\ds-monitor.exe'
# args = ["serve-ica", "--config", 'D:\apps\ds-monitor\config.toml']
# working_dir = 'D:\apps\ds-monitor'
# reload_mode = "serial" # 或 "overlap"（插件须支持两代并行）
# drain_timeout_ms = 120000
# auto_restart = true
# allow_self_reload = true

[py]

# python 插件路径
plugin_path = "/path/to/your/plugin"
config_path = "/path/to/your/config"

# Python hook 调度上限；旧配置不填写时使用以下默认值
max_concurrent_hooks = 32
max_concurrent_hooks_per_plugin = 8
max_inflight_hooks = 1024
max_inflight_hooks_per_plugin = 128
# 插件文件变更检查间隔，单位毫秒
reload_interval_ms = 1000

[ica]

private_key = "" # 与 icalingua 客户端使用的 private_key 一致
host = ""  # docker 版 icalingua 服务的地址
self_id = 0 # 机器人的 qq 号

# 启动时通知的群号/人
notice_room = [-0] # 启动 bot 后通知的群号/人
# 群号请使用群号的负数
notice_start = true # 是否在启动 bot 后通知

# 机器人的管理员
admin_list = [0] # 机器人的管理员
# 过滤的人
filter_list = [0]
# allow_rooms = [-123456] # 可选：指定后只在列出的房间处理实时消息和发送宿主/外部插件消息

[matrix]

home_server = "" # matrix 服务器地址
bot_id = "" # 机器人的 id
bot_password = "" # 机器人的密码

# 启动时通知的房间
notice_room = [""] # 启动 bot 后通知的房间
notice_start = true # 是否在启动 bot 后通知
