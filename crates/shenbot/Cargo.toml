[package]
name = "shenbot"
version = "0.9.6"
edition = "2024"
rust-version = "1.88"

[lib]
name = "shenbot"

[[bin]]
name = "shenbot"
path = "src/main.rs"

[[test]]
name = "ext_plugins"
path = "tests/ext_plugins/mod.rs"
harness = false

[features]
default = ["ica", "tailchat"]
ica = [
    "dep:ed25519-dalek",
    "dep:hex",
    "dep:rust_socketio",
    "dep:base64",
    "dep:reqwest",
    "dep:sha2",
]
tailchat = ["dep:rust_socketio", "dep:md-5", "dep:reqwest"]

[dependencies]
ica-ext-sdk = { path = "../ica-ext-sdk" }

# ica
base64 = { version = "0.23", optional = true }
ed25519-dalek = { version = "3.0", optional = true }
hex = { version = "0.4", optional = true }
sha2 = { version = "0.10", optional = true }

# tailchat
reqwest = { version = "0.13", optional = true, default-features = false, features = ["multipart", "json", "rustls"] }
md-5 = { version = "0.11", optional = true }

# ica & tailchat (socketio)
rust_socketio = { version = "0.6", features = ["async", "rustls-tls-native-roots"], default-features = false, optional = true }

# data
serde.workspace = true
serde_json.workspace = true
chrono = "0.4"
toml = "1.1"
colored = "3.1"
blake3 = "1.8"

# runtime
tokio = { workspace = true, features = ["rt-multi-thread", "time", "signal", "macros", "fs", "io-util", "net", "process", "sync"] }
futures-util = "0.3"
pyo3 = { version = "0.29", features = ["experimental-async", "anyhow"] }
anyhow = { version = "1.0", features = ["backtrace"] }
# async 这玩意以后在搞
# pyo3-async = "0.3.2"
# pyo3-asyncio = { version = "0.20.0", features = ["attributes", "tokio-runtime"] }

# log
tracing = "0.1"
tracing-subscriber = { version = "0.3", features = ["time"] }

[target.'cfg(windows)'.dependencies]
windows-sys = { version = "0.61", features = [
    "Win32_Foundation",
    "Win32_Security",
    "Win32_Storage_FileSystem",
    "Win32_System_IO",
    "Win32_System_JobObjects",
    "Win32_System_Pipes",
    "Win32_System_Threading",
] }

[target.'cfg(unix)'.dependencies]
libc = "0.2"

[dev-dependencies]
tokio = { workspace = true, features = ["test-util"] }
